name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # Detectar que proyectos cambiaron
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      goreview: ${{ steps.filter.outputs.goreview }}
      rules: ${{ steps.filter.outputs.rules }}
      github-app: ${{ steps.filter.outputs.github-app }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            goreview:
              - 'goreview/**'
            rules:
              - 'goreview-rules/**'
            github-app:
              - 'integrations/github-app/**'

  # Tests y build para GoReview
  test-goreview:
    needs: detect-changes
    if: needs.detect-changes.outputs.goreview == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: goreview

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: goreview/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run linter
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: goreview

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build binary
        run: go build -o build/goreview ./cmd/goreview

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: goreview/coverage.out
          flags: goreview

  # Tests y build para GitHub App
  test-github-app:
    needs: detect-changes
    if: needs.detect-changes.outputs.github-app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/github-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: integrations/github-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # Validar reglas YAML
  validate-rules:
    needs: detect-changes
    if: needs.detect-changes.outputs.rules == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML files
        run: |
          pip install yamllint
          yamllint goreview-rules/

  # Auto-merge cuando todos los tests pasen
  auto-merge:
    needs: [test-goreview, test-github-app, validate-rules]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-merge PR
        uses: pascalgn/automerge-action@v0.16.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_METHOD: squash
          MERGE_DELETE_BRANCH: true
          MERGE_LABELS: ""
