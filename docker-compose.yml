version: '3.8'

services:
  # GitHub App
  github-app:
    build:
      context: ./integrations/github-app
      dockerfile: Dockerfile
    container_name: ai-toolkit-github-app
    ports:
      - "3000:3000"
    env_file:
      - ./integrations/github-app/.env
    environment:
      - NODE_ENV=development
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./integrations/github-app/config:/app/config:ro
      - github-app-logs:/app/logs
    networks:
      - ai-toolkit
    restart: unless-stopped

  # Redis para cache (opcional)
  redis:
    image: redis:7-alpine
    container_name: ai-toolkit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ai-toolkit
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  ai-toolkit:
    driver: bridge

volumes:
  redis-data:
  github-app-logs:
